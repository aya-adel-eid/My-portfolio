<div
  class="relative flex flex-col h-full overflow-hidden rounded-2xl group border border-gray-200 dark:border-white/10 bg-white dark:bg-[#252d38] transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-black/5 hover:border-main-500/40 dark:hover:border-main-600/50"
>
  <!-- Image -->
  <div class="relative h-44 sm:h-48 overflow-hidden">
    <img
      [src]="project.image"
      alt="{{ project.name }}"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
    />

    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>

    <h5
      [class]="featured ? 'text-lg sm:text-xl' : 'text-base sm:text-lg'"
      class="absolute bottom-3 left-4 right-4 font-bold text-white leading-snug drop-shadow-md"
    >
      {{ project.name }}
    </h5>
  </div>

  <!-- Content -->
  <div class="p-4 sm:p-5 flex flex-col gap-3 flex-1">
    <!-- Description -->
    <p class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 leading-relaxed line-clamp-2">
      {{ project.description }}
    </p>

    <!-- Tech Tags -->
    <div class="flex flex-wrap gap-1.5">
      @for (tech of project.techStack; track $index) {
        <span
          class="text-[10px] sm:text-xs font-medium px-2.5 py-1 rounded-full"
          [class]="tech.styles"
        >
          {{ tech.name }}
        </span>
      }
    </div>

    <!-- Links ظاهرين دايمًا -->
    <div class="flex items-center gap-3 mt-auto pt-3 border-t border-gray-200 dark:border-white/10">
      <a
        [href]="project.github"
        target="_blank"
        class="flex items-center justify-center gap-1.5 flex-1 py-2 rounded-lg text-xs sm:text-sm font-medium bg-gray-100 dark:bg-white/5 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-white/10 transition-colors"
      >
        <i class="fa-brands fa-github"></i>
        Code
      </a>

      <a
        [href]="project.demo"
        target="_blank"
        class="flex items-center justify-center gap-1.5 flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold bg-main-600 text-white hover:bg-main-500 transition-colors"
      >
        Live Demo
        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
      </a>
    </div>
  </div>
</div>
