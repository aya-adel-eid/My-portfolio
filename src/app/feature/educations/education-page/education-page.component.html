<section
  class="relative overflow-hidden min-h-screen flex items-center pt-30 sm:pt-32 lg:pt-32 pb-14 sm:pb-20 bg-gray-100 dark:bg-[#1F262F] transition-colors duration-500"
>
  <!-- Background blobs -->
  <div
    class="absolute top-20 left-5 sm:left-20 w-48 h-48 sm:w-72 sm:h-72 bg-main-600/10 dark:bg-main-600/20 rounded-full blur-3xl pointer-events-none"
  ></div>
  <div
    class="absolute bottom-20 right-5 sm:right-20 w-48 h-48 sm:w-72 sm:h-72 bg-purple-500/10 dark:bg-purple-600/15 rounded-full blur-3xl pointer-events-none"
  ></div>

  <div class="container mx-auto px-4 sm:px-6 relative z-10 max-w-7xl">
    <!-- Header -->
    <div class="text-center mb-12 sm:mb-16">
      <span
        class="inline-flex items-center gap-2 bg-main-500/10 text-main-600 dark:text-main-400 text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-full uppercase tracking-wide"
        data-aos="fade-down"
        data-aos-delay="100"
      >
        My Education
      </span>

      <h2
        class="text-2xl sm:text-3xl lg:text-4xl font-bold mt-4 text-gray-900 dark:text-white"
        data-aos="fade-up"
        data-aos-delay="200"
      >
        Academic
        <span class="bg-gradient-to-r from-main-500 to-purple-500 bg-clip-text text-transparent"
          >Journey</span
        >
      </h2>

      <p
        class="text-sm sm:text-base text-gray-600 dark:text-gray-300 w-full sm:w-[85%] lg:w-[65%] mx-auto leading-relaxed mt-4"
        data-aos="fade-up"
        data-aos-delay="300"
      >
        My academic training and hands-on experience that built my foundation as a frontend
        developer.
      </p>
    </div>

    <!-- Timeline -->
    <div class="relative max-w-3xl mx-auto">
      <!-- Vertical line (gradient) -->
      <div
        class="absolute left-5 sm:left-8 top-2 bottom-2 w-0.5 bg-gradient-to-b from-main-500 via-main-500/40 to-purple-500/40"
      ></div>

      @for (edu of education_arr; track $index) {
        <div
          class="group relative flex gap-5 sm:gap-10 mb-8 sm:mb-10 last:mb-0"
          data-aos="fade-up-right"
          [attr.data-aos-delay]="$index * 200"
        >
          <!-- Dot + Icon -->
          <div class="relative z-10 shrink-0">
            @if (edu.current) {
              <span class="absolute inset-0 rounded-full bg-main-500/40 animate-ping"></span>
            }
            <div
              class="relative w-10 h-10 sm:w-16 sm:h-16 rounded-full flex items-center justify-center bg-white dark:bg-[#2a333e] border-2 border-main-500 shadow-md shadow-main-500/20 transition-all duration-300 ease-out group-hover:scale-110 group-hover:shadow-lg group-hover:shadow-main-500/40 group-hover:-rotate-6"
            >
              <i
                [class]="edu.icon"
                class="text-main-500 text-sm sm:text-xl transition-transform duration-300 ease-out"
              ></i>
            </div>
          </div>

          <!-- Card -->
          <app-education-card [edu]="edu"></app-education-card>
        </div>
      }
    </div>
  </div>
</section>
